name: Publish Battle Armory Hitboxes 3.0 as client 0022
on:
  push:
    paths:
      - '.github/workflows/publish-hitboxes-300-client-0022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download validated Hitboxes 3.0 artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          URL='https://uc564f0bcdedd059d69554921e5b.dl.dropboxusercontent.com/cd/0/get/DIJSSezUH2XuYIQlbvDjXh0WgXPt6LXbP9zz5hqeX0lAy92Nq6sco-TR_M6uDoxcOrWEy0jXNhPNO4RSJyQUYHerlU8ShJq18iOmpa_faC4fY6lsyY2BVIZEV5P-Z9whukjWeE3b20D9Us_i_uqTwQFwQ2bq-zBHDKsoXDoE-i4jzg/file?c_luid=44ddf4f6'
          curl -L --fail --retry 2 --connect-timeout 20 "$URL" -o dist/battlearmory-hitboxes-3.0.0.jar
          echo '7CC290E237C65A33D277A8E104F2DB25310B32FF59B959455EA5E4D11BC15AD1  dist/battlearmory-hitboxes-3.0.0.jar' | sha256sum -c -
          test "$(wc -c < dist/battlearmory-hitboxes-3.0.0.jar | tr -d '[:space:]')" = '55421'

      - name: Publish payload and client build 0022
        shell: bash
        run: |
          set -euxo pipefail
          DEST='payload/mods/battlearmory-hitboxes-1.0.0.jar'
          mkdir -p payload/mods builds
          cp dist/battlearmory-hitboxes-3.0.0.jar "$DEST"
          printf '%s\n' '7CC290E237C65A33D277A8E104F2DB25310B32FF59B959455EA5E4D11BC15AD1' > "$DEST.sha256"
          printf '%s\n' '55421' > "$DEST.size"

          python - <<'PY'
          import json
          from pathlib import Path

          stable_path = Path('stable.json')
          stable = json.loads(stable_path.read_text(encoding='utf-8'))
          if stable.get('build') != 21 or stable.get('build_manifest') != 'builds/0021.json':
              raise SystemExit(f"Refusing to overwrite unexpected stable baseline: {stable}")

          old = json.loads(Path('builds/0021.json').read_text(encoding='utf-8'))
          new = json.loads(json.dumps(old))
          new['build'] = 22
          new['name'] = 'Battle Armory Client 0022'
          new['state'] = 'staging'

          path = 'mods/battlearmory-hitboxes-1.0.0.jar'
          entry = {
              'path': path,
              'url': 'https://raw.githubusercontent.com/frasionundead/BattleArmory-Client/main/payload/mods/battlearmory-hitboxes-1.0.0.jar',
              'size': 55421,
              'sha256': '7cc290e237c65a33d277a8e104f2db25310b32ff59b959455ea5e4d11bc15ad1'
          }
          files = new.setdefault('files', [])
          matches = [i for i, f in enumerate(files) if f.get('path') == path]
          if matches:
              files[matches[0]] = entry
              for i in reversed(matches[1:]):
                  del files[i]
          else:
              files.append(entry)

          components = new.setdefault('components', [])
          hitbox_component = {
              'id': 'battlearmory_hitboxes',
              'status': 'READY',
              'notes': 'Hitboxes 3.0: exact posed TaCZ player hitgroups and map-dimension 85% head/head-hitbox profile; validated locally on server and CLIENT 0021-derived runtime.'
          }
          found = False
          for i, c in enumerate(components):
              if c.get('id') == 'battlearmory_hitboxes':
                  components[i] = hitbox_component
                  found = True
                  break
          if not found:
              components.append(hitbox_component)

          Path('builds/0022.json').write_text(json.dumps(new, indent=2) + '\n', encoding='utf-8')
          stable['build'] = 22
          stable['build_manifest'] = 'builds/0022.json'
          stable['status'] = 'staging'
          stable_path.write_text(json.dumps(stable, indent=2) + '\n', encoding='utf-8')
          PY

          python -m json.tool builds/0022.json >/dev/null
          python -m json.tool stable.json >/dev/null
          grep -q '"build": 22' stable.json
          grep -q 'builds/0022.json' stable.json
          grep -q 'battlearmory-hitboxes-1.0.0.jar' builds/0022.json

      - name: Commit published build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'battlearmory-bot'
          git config user.email 'battlearmory-bot@users.noreply.github.com'
          git add \
            payload/mods/battlearmory-hitboxes-1.0.0.jar \
            payload/mods/battlearmory-hitboxes-1.0.0.jar.sha256 \
            payload/mods/battlearmory-hitboxes-1.0.0.jar.size \
            builds/0022.json \
            stable.json
          git rm .github/workflows/publish-hitboxes-300-client-0022.yml
          git commit -m 'Publish Hitboxes 3.0 as client build 0022'
          git push
