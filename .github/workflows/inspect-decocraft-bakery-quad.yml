name: Inspect Decocraft bakery quad construction
on:
  push:
    paths:
      - '.github/workflows/inspect-decocraft-bakery-quad.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect bakeQuad bytecode
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'payload/mods/decocraft-3.0.4-1.20.1-slim.jar|com.razz.decocraft.models.bbmodel.BlockbenchBakery' \
            'payload/mods/decocraft_nature-1.0.4-1.20.1.jar|com.razz.decocraft_nature.models.bbmodel.BlockbenchBakery'; do
            IFS='|' read -r jar cls <<< "$spec"
            echo "===== $cls ====="
            javap -classpath "$jar" -p -s "$cls"
            echo '--- bakeQuad bytecode ---'
            javap -classpath "$jar" -p -c "$cls" | sed -n '/bakeQuad(/,/^  [^ ]/p' | head -n 420
          done
