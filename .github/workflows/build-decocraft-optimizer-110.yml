name: Build Decocraft optimizer 1.1.0
on:
  push:
    paths:
      - '.github/workflows/build-decocraft-optimizer-110.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build helper JAR
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow

          OLD='payload/mods/battlearmory-decocraft-cache-1.0.0.jar'
          OUT='/tmp/battlearmory-decocraft-cache-1.0.0.jar'
          STAGE='/tmp/ba-decocraft-stage'
          CLASSES='/tmp/ba-decocraft-classes'
          rm -rf "$STAGE" "$CLASSES" "$OUT"
          mkdir -p "$STAGE" "$CLASSES"
          unzip -q "$OLD" -d "$STAGE"

          javac --release 17 -d "$CLASSES" tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          mkdir -p "$STAGE/com/battlearmory/decocraftcache" "$STAGE/coremods" "$STAGE/META-INF"
          cp "$CLASSES/com/battlearmory/decocraftcache/DecocraftCacheRuntime.class" "$STAGE/com/battlearmory/decocraftcache/"
          cp "$CLASSES/com/battlearmory/decocraftcache/DecocraftCacheRuntime\$FamilyState.class" "$STAGE/com/battlearmory/decocraftcache/"
          cp tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js "$STAGE/coremods/"
          cp tools/decocraft-cache/META-INF/mods.toml "$STAGE/META-INF/mods.toml"

          python - <<'PY'
          import io, zipfile
          from pathlib import Path
          from PIL import Image

          jars = [
              ('decocraft', Path('payload/mods/decocraft-3.0.4-1.20.1-slim.jar')),
              ('decocraft_nature', Path('payload/mods/decocraft_nature-1.0.4-1.20.1.jar')),
          ]
          lines = ['# Generated from pinned Battle Armory textures. Partial alpha must remain translucent.']
          counts = {}
          for ns, jar in jars:
              partial = []
              with zipfile.ZipFile(jar) as z:
                  prefix = f'assets/{ns}/textures/block/'
                  for name in z.namelist():
                      if not name.startswith(prefix) or not name.lower().endswith('.png'):
                          continue
                      img = Image.open(io.BytesIO(z.read(name))).convert('RGBA')
                      alphas = set(img.getchannel('A').getdata())
                      if any(0 < a < 255 for a in alphas):
                          rel = name[len(f'assets/{ns}/textures/'):-4]
                          partial.append(f'{ns}:{rel}')
              partial.sort()
              counts[ns] = len(partial)
              lines.extend(partial)
          if counts.get('decocraft', 0) < 300 or counts.get('decocraft_nature', 0) < 20:
              raise SystemExit(f'Unexpected alpha scan counts: {counts}')
          Path('/tmp/ba-decocraft-stage/battlearmory_translucent_materials.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('partial-alpha counts:', counts, 'total=', sum(counts.values()))
          PY

          cp "$STAGE/META-INF/MANIFEST.MF" /tmp/ba-manifest.mf
          rm "$STAGE/META-INF/MANIFEST.MF"
          jar cfm "$OUT" /tmp/ba-manifest.mf -C "$STAGE" .
          unzip -t "$OUT"
          jar tf "$OUT" | grep -F 'battlearmory_translucent_materials.txt'
          jar tf "$OUT" | grep -F 'DecocraftCacheRuntime$FamilyState.class'
          unzip -p "$OUT" coremods/battlearmory_decocraft_cache.js | grep -F 'decocraft_nature'
          unzip -p "$OUT" META-INF/mods.toml | grep -F 'version="1.1.0"'
          javap -classpath "$OUT" -p com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -F 'renderTypeFunction'

          cp "$OUT" "$OLD"
          sha256sum "$OLD"
          stat -c '%s bytes' "$OLD"

      - name: Publish build 0008 metadata
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          jar = Path('payload/mods/battlearmory-decocraft-cache-1.0.0.jar')
          raw = jar.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          size = len(raw)

          index_path = Path('payload/mods/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index[jar.name] = {'sha256': sha, 'size': size}
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          old = json.loads(Path('builds/0007.json').read_text(encoding='utf-8'))
          old['build'] = 8
          old['name'] = 'Battle Armory Client 0008'
          old['state'] = 'staging'
          found = False
          for f in old.get('files', []):
              if f.get('path') == 'mods/battlearmory-decocraft-cache-1.0.0.jar':
                  f['size'] = size
                  f['sha256'] = sha
                  found = True
          if not found:
              raise SystemExit('helper file entry missing from build 0007')
          for c in old.get('components', []):
              if c.get('id') == 'decocraft_render_cache':
                  c['notes'] = 'Client-only Battle Armory optimizer caches animated geometry for Decocraft + Decocraft Nature and avoids translucent sorting for binary-alpha/opaque materials while preserving partial-alpha blending.'
                  c['status'] = 'DIAGNOSTIC'
          Path('builds/0008.json').write_text(json.dumps(old, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          stable_path = Path('stable.json')
          stable = json.loads(stable_path.read_text(encoding='utf-8'))
          stable['build'] = 8
          stable['build_manifest'] = 'builds/0008.json'
          stable['status'] = 'staging'
          stable_path.write_text(json.dumps(stable, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('/tmp/ba-helper.sha256').write_text(sha + '\n')
          Path('/tmp/ba-helper.size').write_text(str(size) + '\n')
          print('helper sha256=', sha, 'size=', size)
          PY

      - name: Clean temporary engineering dumps and commit
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _inspect _decomp
          rm -f .github/workflows/inspect-render-hotspots.yml
          rm -f .github/workflows/decompile-render-hotspots.yml
          rm -f .github/workflows/scan-decocraft-alpha.yml
          rm -f .github/workflows/build-decocraft-optimizer-110.yml

          git config user.name 'battlearmory-bot'
          git config user.email 'battlearmory-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Decocraft multi-mod optimizer build 0008'
          git push
