name: Publish Decocraft optimizer 1.3.0 model-memory dedupe
on:
  push:
    paths:
      - '.github/workflows/publish-decocraft-optimizer-130.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Add parsed-model deduplication
        shell: bash
        run: |
          set -euxo pipefail
          python .github/scripts/patch-decocraft-130.py
          grep -n 'sharedResourceModel' tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          grep -n 'registryParsedModels' tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          grep -n 'registry_bbmodel_dedupe' tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js
          grep -n 'resource_bbmodel_dedupe' tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js
          grep -n 'version="1.3.0"' tools/decocraft-cache/META-INF/mods.toml

      - name: Verify target signatures in both Decocraft jars
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'payload/mods/decocraft-3.0.4-1.20.1-slim.jar|com.razz.decocraft.utils.JsonParser|com.razz.decocraft.models.bbmodel.BlockbenchLoader|com.razz.decocraft.models.bbmodel.BBModelLoader' \
            'payload/mods/decocraft_nature-1.0.4-1.20.1.jar|com.razz.decocraft_nature.utils.JsonParser|com.razz.decocraft_nature.models.bbmodel.BlockbenchLoader|com.razz.decocraft_nature.models.bbmodel.BBModelLoader'; do
            IFS='|' read -r jar parser geometry raw <<< "$spec"
            javap -classpath "$jar" -p -s "$parser" | grep -A1 'parseModel(java.lang.String, java.util.zip.ZipFile)'
            javap -classpath "$jar" -p -s "$geometry" | grep -A1 'BlockbenchModel read(com.google.gson.JsonObject, com.google.gson.JsonDeserializationContext)'
            javap -classpath "$jar" -p -s "$raw" | grep -A1 'loadModel(java.io.Reader)'
            javap -classpath "$jar" -p -c "$geometry" | grep 'BBModelLoader.loadModel:(Ljava/io/Reader;)'
          done

      - name: Compile and package optimizer
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/decocraft130 dist
          mkdir -p build/decocraft130/classes build/decocraft130/jar/META-INF build/decocraft130/jar/coremods dist
          javac -source 17 -target 17 \
            -d build/decocraft130/classes \
            tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          cp -R build/decocraft130/classes/com build/decocraft130/jar/
          cp tools/decocraft-cache/META-INF/mods.toml build/decocraft130/jar/META-INF/mods.toml
          cp tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js build/decocraft130/jar/coremods/
          OLD=payload/mods/battlearmory-decocraft-cache-1.0.0.jar
          unzip -p "$OLD" META-INF/MANIFEST.MF > build/decocraft130/MANIFEST.MF
          unzip -p "$OLD" META-INF/coremods.json > build/decocraft130/jar/META-INF/coremods.json
          unzip -p "$OLD" pack.mcmeta > build/decocraft130/jar/pack.mcmeta
          unzip -p "$OLD" battlearmory_translucent_materials.txt > build/decocraft130/jar/battlearmory_translucent_materials.txt
          node --check tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js
          jar cfm dist/battlearmory-decocraft-cache-1.3.0.jar build/decocraft130/MANIFEST.MF -C build/decocraft130/jar .

      - name: Static verification
        shell: bash
        run: |
          set -euxo pipefail
          JAR=dist/battlearmory-decocraft-cache-1.3.0.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^META-INF/coremods.json$'
          jar tf "$JAR" | grep -q '^coremods/battlearmory_decocraft_cache.js$'
          javap -classpath "$JAR" com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -q 'parsedRegistryModelGet'
          javap -classpath "$JAR" com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -q 'parsedRegistryModelPut'
          javap -classpath "$JAR" com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -q 'sharedResourceModel'
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="1.3.0"'
          unzip -p "$JAR" coremods/battlearmory_decocraft_cache.js | grep -q 'registry_bbmodel_dedupe'
          unzip -p "$JAR" coremods/battlearmory_decocraft_cache.js | grep -q 'resource_bbmodel_dedupe'
          sha256sum "$JAR"
          wc -c < "$JAR"

      - name: Publish payload and build 0011
        shell: bash
        run: |
          set -euxo pipefail
          JAR=dist/battlearmory-decocraft-cache-1.3.0.jar
          DEST=payload/mods/battlearmory-decocraft-cache-1.0.0.jar
          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          SIZE="$(wc -c < "$JAR" | tr -d '[:space:]')"
          cp "$JAR" "$DEST"
          printf '%s\n' "$SHA" > "$DEST.sha256"
          printf '%s\n' "$SIZE" > "$DEST.size"

          SHA="$SHA" SIZE="$SIZE" python - <<'PY'
          import json, os
          from pathlib import Path
          old = json.loads(Path('builds/0010.json').read_text(encoding='utf-8'))
          old['build'] = 11
          old['name'] = 'Battle Armory Client 0011'
          old['state'] = 'staging'
          found = False
          for f in old.get('files', []):
              if f.get('path') == 'mods/battlearmory-decocraft-cache-1.0.0.jar':
                  f['size'] = int(os.environ['SIZE'])
                  f['sha256'] = os.environ['SHA']
                  found = True
          if not found:
              raise SystemExit('helper entry missing from build 0010')
          for c in old.get('components', []):
              if c.get('id') == 'decocraft_render_cache':
                  c['notes'] = ('v1.3.0 client optimizer: v1.2.1 render/reload fixes plus canonical BBModel parse graphs '
                                'for Decocraft and Decocraft Nature. Repeated metadata entries and resource model JSONs '
                                'share parsed geometry instead of retaining duplicate strings/maps/faces/UV/vector graphs.')
          Path('builds/0011.json').write_text(json.dumps(old, indent=2) + '\n', encoding='utf-8')
          stable = json.loads(Path('stable.json').read_text(encoding='utf-8'))
          stable['build'] = 11
          stable['build_manifest'] = 'builds/0011.json'
          stable['status'] = 'staging'
          Path('stable.json').write_text(json.dumps(stable, indent=2) + '\n', encoding='utf-8')
          PY

          python -m json.tool builds/0011.json >/dev/null
          python -m json.tool stable.json >/dev/null
          grep -n '"build": 11' stable.json
          grep -n 'battlearmory-decocraft-cache-1.0.0.jar' builds/0011.json
          git config user.name 'battlearmory-bot'
          git config user.email 'battlearmory-bot@users.noreply.github.com'
          git add \
            tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java \
            tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js \
            tools/decocraft-cache/META-INF/mods.toml \
            payload/mods/battlearmory-decocraft-cache-1.0.0.jar \
            payload/mods/battlearmory-decocraft-cache-1.0.0.jar.sha256 \
            payload/mods/battlearmory-decocraft-cache-1.0.0.jar.size \
            builds/0011.json stable.json
          git commit -m 'Publish Decocraft model-memory optimizer 1.3.0 as build 0011'
          git push
