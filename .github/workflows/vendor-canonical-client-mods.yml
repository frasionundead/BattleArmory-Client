          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          : > .vendor/index.tsv

          while IFS=$'\t' read -r name expected_size url; do
            [ -n "$name" ] || continue
            tmp=".vendor/$name.part"
            dest="payload/mods/$name"
            echo "Vendoring $name"
            curl -fL --retry 2 --retry-delay 1 "$url" -o "$tmp"
            actual_size=$(stat -c%s "$tmp")
            if [ "$actual_size" != "$expected_size" ]; then
              echo "SIZE MISMATCH for $name: expected $expected_size got $actual_size" >&2
              exit 1
            fi
            actual_sha=$(sha256sum "$tmp" | awk '{print $1}')
            mv "$tmp" "$dest"
            printf '%s\t%s\t%s\n' "$name" "$actual_size" "$actual_sha" >> .vendor/index.tsv
            git add -- "$dest"
            if ! git diff --cached --quiet; then
              git commit -m "Vendor canonical client mod: $name"
              git push origin HEAD:main
            fi
          done < .vendor/mods.tsv

      - name: Pin manifest to Battle Armory payload URLs and exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          index = {}
          for line in Path('.vendor/index.tsv').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              name, size, sha = line.split('\t')
              index[name] = {'size': int(size), 'sha256': sha}

          manifest_path = Path('builds/0003.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          missing = []
          for item in manifest['files']:
              if not item['path'].startswith('mods/'):
                  continue
              name = item['path'].split('/', 1)[1]
              meta = index.get(name)
              if meta is None:
                  missing.append(name)
                  continue
              item.pop('source', None)
              item['url'] = f'https://raw.githubusercontent.com/frasionundead/BattleArmory-Client/main/payload/mods/{name}'
              item['size'] = meta['size']
              item['sha256'] = meta['sha256']

          if missing:
              raise SystemExit('Manifest mods missing from canonical import: ' + ', '.join(missing))

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('payload/mods/index.json').write_text(
              json.dumps(index, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8')
          PY

          git add builds/0003.json payload/mods/index.json
          git commit -m 'Pin all client mods to canonical Battle Armory payload'
          git push origin HEAD:main
