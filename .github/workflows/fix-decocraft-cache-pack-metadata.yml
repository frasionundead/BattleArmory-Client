name: Fix Decocraft cache pack metadata

on:
  push:
    paths:
      - '.github/workflows/fix-decocraft-cache-pack-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify current helper
        shell: bash
        run: |
          set -euo pipefail
          HELPER='payload/mods/battlearmory-decocraft-cache-1.0.0.jar'
          test -s "$HELPER"
          echo '23f6492b474a9a39a05d6e64d9b70de90005e3f3bc0adc7130c0968b07a1b214  payload/mods/battlearmory-decocraft-cache-1.0.0.jar' | sha256sum -c -
          if jar tf "$HELPER" | grep -q '^pack.mcmeta$'; then
            echo 'pack.mcmeta unexpectedly already present' >&2
            exit 1
          fi

      - name: Add valid Minecraft 1.20.1 resource-pack metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, zipfile
          src = 'payload/mods/battlearmory-decocraft-cache-1.0.0.jar'
          tmp = src + '.tmp'
          pack = {
              'pack': {
                  'pack_format': 15,
                  'description': 'Battle Armory Decocraft cache helper resources'
              }
          }
          with zipfile.ZipFile(src, 'r') as zin, zipfile.ZipFile(tmp, 'w') as zout:
              for item in zin.infolist():
                  if item.filename == 'pack.mcmeta':
                      continue
                  zout.writestr(item, zin.read(item.filename))
              zout.writestr('pack.mcmeta', json.dumps(pack, ensure_ascii=False, separators=(',', ':')) + '\n')
          os.replace(tmp, src)
          PY

      - name: Verify fixed helper and update index
        shell: bash
        run: |
          set -euo pipefail
          HELPER='payload/mods/battlearmory-decocraft-cache-1.0.0.jar'
          jar tf "$HELPER" | grep -q '^META-INF/mods.toml$'
          jar tf "$HELPER" | grep -q '^META-INF/coremods.json$'
          jar tf "$HELPER" | grep -q '^pack.mcmeta$'
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          helper = 'payload/mods/battlearmory-decocraft-cache-1.0.0.jar'
          with zipfile.ZipFile(helper) as z:
              meta = json.loads(z.read('pack.mcmeta'))
              assert meta['pack']['pack_format'] == 15
          data = open(helper, 'rb').read()
          sha = hashlib.sha256(data).hexdigest()
          size = len(data)
          idx_path = 'payload/mods/index.json'
          idx = json.load(open(idx_path, encoding='utf-8'))
          idx['battlearmory-decocraft-cache-1.0.0.jar'] = {'sha256': sha, 'size': size}
          with open(idx_path, 'w', encoding='utf-8') as f:
              json.dump(idx, f, indent=2, ensure_ascii=False)
              f.write('\n')
          os.makedirs('.build', exist_ok=True)
          import base64, textwrap
          encoded = base64.b64encode(data).decode('ascii')
          with open('.build/battlearmory-decocraft-cache-1.0.0-fixed.jar.b64', 'w', encoding='ascii') as f:
              for line in textwrap.wrap(encoded, 76):
                  f.write(line + '\n')
          open('.build/battlearmory-decocraft-cache-1.0.0-fixed.jar.sha256','w').write(sha+'\n')
          open('.build/battlearmory-decocraft-cache-1.0.0-fixed.jar.size','w').write(str(size)+'\n')
          print('sha256=' + sha)
          print('size=' + str(size))
          PY

      - name: Commit fixed helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'battle-armory-bot'
          git config user.email 'battle-armory-bot@users.noreply.github.com'
          git add payload/mods/battlearmory-decocraft-cache-1.0.0.jar payload/mods/index.json .build/battlearmory-decocraft-cache-1.0.0-fixed.jar.b64 .build/battlearmory-decocraft-cache-1.0.0-fixed.jar.sha256 .build/battlearmory-decocraft-cache-1.0.0-fixed.jar.size
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Decocraft cache resource-pack metadata'
          git push
