name: Scan Decocraft texture alpha
on:
  push:
    paths:
      - '.github/workflows/scan-decocraft-alpha.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan PNG alpha
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import io, zipfile
          from PIL import Image
          from pathlib import Path

          jars = [
              ('decocraft', Path('payload/mods/decocraft-3.0.4-1.20.1-slim.jar')),
              ('decocraft_nature', Path('payload/mods/decocraft_nature-1.0.4-1.20.1.jar')),
          ]
          out=[]
          for ns, jar in jars:
              partial=[]; binary=[]; opaque=[]; errors=[]
              with zipfile.ZipFile(jar) as z:
                  prefix=f'assets/{ns}/textures/block/'
                  for name in z.namelist():
                      if not name.startswith(prefix) or not name.lower().endswith('.png'):
                          continue
                      try:
                          img=Image.open(io.BytesIO(z.read(name))).convert('RGBA')
                          alphas=set(img.getchannel('A').getdata())
                          rel=name[len(f'assets/{ns}/textures/'): -4]
                          if any(0<a<255 for a in alphas): partial.append(rel)
                          elif 0 in alphas: binary.append(rel)
                          else: opaque.append(rel)
                      except Exception as e:
                          errors.append((name,repr(e)))
              out.append(f'[{ns}] total={len(partial)+len(binary)+len(opaque)} partial={len(partial)} binary={len(binary)} opaque={len(opaque)}')
              out.append('PARTIAL_ALPHA:')
              out += [f'{ns}:{p}' for p in sorted(partial)]
              out.append('BINARY_ALPHA_COUNT='+str(len(binary)))
              out.append('OPAQUE_COUNT='+str(len(opaque)))
              if errors:
                  out.append('ERRORS:')
                  out += [f'{n}: {e}' for n,e in errors]
              out.append('')
          Path('_inspect').mkdir(exist_ok=True)
          Path('_inspect/alpha-report.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'battlearmory-bot'
          git config user.email 'battlearmory-bot@users.noreply.github.com'
          git add _inspect/alpha-report.txt
          git commit -m 'Scan Decocraft texture alpha'
          git push
