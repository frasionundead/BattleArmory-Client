name: Analyze Decocraft memory footprint

on:
  push:
    paths:
      - '.github/workflows/analyze-decocraft-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Decocraft resources
        shell: bash
        run: |
          set -euo pipefail
          JAR=payload/mods/decocraft-3.0.4-1.20.1-slim.jar
          test -s "$JAR"
          echo '=== JAR size ==='
          stat -c '%s bytes' "$JAR"
          echo
          echo '=== Resource counts ==='
          python - <<'PY'
          import zipfile, json, collections, os
          jar='payload/mods/decocraft-3.0.4-1.20.1-slim.jar'
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              cats=collections.Counter()
              for n in names:
                  if n.endswith('/'):
                      continue
                  if n.startswith('assets/decocraft/models/block/') and n.endswith('.json'): cats['model_block_json']+=1
                  elif n.startswith('assets/decocraft/models/item/') and n.endswith('.json'): cats['model_item_json']+=1
                  elif n.startswith('assets/decocraft/blockstates/') and n.endswith('.json'): cats['blockstate_json']+=1
                  elif n.startswith('assets/decocraft/') and n.endswith('.json'): cats['other_asset_json']+=1
                  elif n.startswith('assets/decocraft/') and (n.endswith('.bbmodel') or n.endswith('.bbmodel.json')): cats['bbmodel']+=1
                  elif n.startswith('assets/decocraft/textures/'): cats['textures']+=1
              print('\n'.join(f'{k}: {v}' for k,v in sorted(cats.items())))
              # Biggest files under assets/decocraft
              rows=[]
              for n in names:
                  if n.startswith('assets/decocraft/') and not n.endswith('/'):
                      info=z.getinfo(n)
                      rows.append((info.file_size,n))
              print('\n=== 40 largest Decocraft assets ===')
              for s,n in sorted(rows, reverse=True)[:40]:
                  print(f'{s:10d}  {n}')

              # Parse normal model JSON and count geometry-ish fields.
              element_total=face_total=rotation_total=0
              parsed=failed=0
              top=[]
              for n in names:
                  if not (n.startswith('assets/decocraft/models/') and n.endswith('.json')):
                      continue
                  try:
                      obj=json.loads(z.read(n))
                  except Exception:
                      failed+=1; continue
                  parsed+=1
                  elems=obj.get('elements') if isinstance(obj,dict) else None
                  e=len(elems) if isinstance(elems,list) else 0
                  f=0
                  r=0
                  if isinstance(elems,list):
                      for el in elems:
                          if isinstance(el,dict):
                              faces=el.get('faces')
                              if isinstance(faces,dict): f += len(faces)
                              if 'rotation' in el: r += 1
                  element_total+=e; face_total+=f; rotation_total+=r
                  if e or f: top.append((f,e,n))
              print('\n=== Vanilla model JSON geometry ===')
              print('parsed:',parsed,'failed:',failed,'elements:',element_total,'faces:',face_total,'rotated_elements:',rotation_total)
              print('Top 30 by face count:')
              for f,e,n in sorted(top, reverse=True)[:30]:
                  print(f'faces={f:7d} elements={e:7d} {n}')

              # Extension distribution under models and model-like paths.
              ext=collections.Counter()
              for n in names:
                  if n.startswith('assets/decocraft/models/') and not n.endswith('/'):
                      base=os.path.basename(n)
                      ext[base.split('.',1)[-1] if '.' in base else '<none>'] += 1
              print('\n=== assets/decocraft/models extension distribution ===')
              for k,v in ext.most_common(): print(k,v)
          PY

      - name: Inspect class names and decompile model pipeline
        shell: bash
        run: |
          set -euo pipefail
          JAR=payload/mods/decocraft-3.0.4-1.20.1-slim.jar
          mkdir -p /tmp/cfr /tmp/decomp
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr/cfr.jar
          echo '=== Relevant classes ==='
          jar tf "$JAR" | grep '^com/razz/decocraft/.*\.class$' | grep -Ei '(model|json|render|item|client|block)' | sed 's#/#.#g;s#\.class$##' | head -n 300
          echo
          echo '=== Decompile selected classes ==='
          classes=(
            com.razz.decocraft.common.JsonContainer
            com.razz.decocraft.models.bbmodel.BBModel
            com.razz.decocraft.client.render.AnimatedRenderer
            com.razz.decocraft.client.render.AnimatedModelRenderer
            com.razz.decocraft.common.blocks.DecocraftBlock
          )
          for c in "${classes[@]}"; do
            echo "--- $c ---"
            java -jar /tmp/cfr/cfr.jar "$JAR" --outputdir /tmp/decomp --silent true --extraclasspath "$JAR" --jarfilter "${c##*.}" >/dev/null 2>&1 || true
            p="/tmp/decomp/${c//.//}.java"
            if [ -f "$p" ]; then
              sed -n '1,260p' "$p"
            else
              javap -classpath "$JAR" -p -c "$c" 2>/dev/null | sed -n '1,320p' || true
            fi
          done

      - name: Scan bytecode references to Minecraft model baking
        shell: bash
        run: |
          set -euo pipefail
          JAR=payload/mods/decocraft-3.0.4-1.20.1-slim.jar
          echo '=== Class constant-pool hits for model/bake APIs ==='
          tmp=$(mktemp -d)
          cd "$tmp"
          jar xf "$GITHUB_WORKSPACE/$JAR"
          grep -aRIl -E 'BakedQuad|UnbakedModel|BakedModel|ModelResourceLocation|ModelBakery|ModelManager|BlockModel' com/razz/decocraft 2>/dev/null | head -n 150 | sed 's#/#.#g;s#\.class$##'
