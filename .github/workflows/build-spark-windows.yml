name: Build Battle Armory Spark Windows Allocation

on:
  push:
    paths:
      - '.github/workflows/build-spark-windows.yml'
      - 'diagnostics/spark-windows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Battle Armory client repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact stock spark 1.10.53 Forge jar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .spark-stock .spark-patch-classes
          mkdir -p .spark-stock

          curl -fsSL 'https://api.modrinth.com/v2/version/4FXHDE9F' -o .spark-stock/version.json
          URL="$(jq -r '.files[] | select(.filename == "spark-1.10.53-forge.jar") | .url' .spark-stock/version.json)"
          EXPECTED_SHA512="$(jq -r '.files[] | select(.filename == "spark-1.10.53-forge.jar") | .hashes.sha512' .spark-stock/version.json)"
          test -n "$URL"
          test "$URL" != 'null'
          test -n "$EXPECTED_SHA512"
          test "$EXPECTED_SHA512" != 'null'

          curl -fL "$URL" -o .spark-stock/spark-1.10.53-forge.jar
          printf '%s  %s\n' "$EXPECTED_SHA512" '.spark-stock/spark-1.10.53-forge.jar' | sha512sum -c -

          jar tf .spark-stock/spark-1.10.53-forge.jar | grep -q '^META-INF/mods.toml$'
          jar tf .spark-stock/spark-1.10.53-forge.jar | grep -q '^me/lucko/spark/common/sampler/SamplerBuilder.class$'

      - name: Compile Windows JFR allocation backend against stock jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spark-patch-classes

          javac --release 17 \
            -cp .spark-stock/spark-1.10.53-forge.jar \
            -d .spark-patch-classes \
            diagnostics/spark-windows/JfrAllocationSampler.java \
            diagnostics/spark-windows/SamplerBuilder.java

          test -f .spark-patch-classes/me/lucko/spark/common/sampler/SamplerBuilder.class
          test -f .spark-patch-classes/me/lucko/spark/common/sampler/async/JfrAllocationSampler.class

      - name: Patch stock Forge jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/mods
          cp .spark-stock/spark-1.10.53-forge.jar payload/mods/spark-1.10.53-forge-ba-winalloc.jar

          jar uf payload/mods/spark-1.10.53-forge-ba-winalloc.jar \
            -C .spark-patch-classes me/lucko/spark/common/sampler/SamplerBuilder.class \
            -C .spark-patch-classes me/lucko/spark/common/sampler/async/JfrAllocationSampler.class

          jar tf payload/mods/spark-1.10.53-forge-ba-winalloc.jar | grep -q '^me/lucko/spark/common/sampler/async/JfrAllocationSampler.class$'
          javap -classpath payload/mods/spark-1.10.53-forge-ba-winalloc.jar \
            me.lucko.spark.common.sampler.async.JfrAllocationSampler \
            | grep -q 'isSupported'

          sha256sum payload/mods/spark-1.10.53-forge-ba-winalloc.jar \
            | awk '{print $1}' > payload/mods/spark-1.10.53-forge-ba-winalloc.jar.sha256
          wc -c < payload/mods/spark-1.10.53-forge-ba-winalloc.jar \
            | tr -d ' ' > payload/mods/spark-1.10.53-forge-ba-winalloc.jar.size

      - name: Commit built diagnostic jar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'battle-armory-bot'
          git config user.email 'battle-armory-bot@users.noreply.github.com'
          git add \
            payload/mods/spark-1.10.53-forge-ba-winalloc.jar \
            payload/mods/spark-1.10.53-forge-ba-winalloc.jar.sha256 \
            payload/mods/spark-1.10.53-forge-ba-winalloc.jar.size
          if git diff --cached --quiet; then
            echo 'Custom spark jar already up to date.'
            exit 0
          fi
          git commit -m 'Build spark 1.10.53 with Windows JFR allocation backend'
          git push
