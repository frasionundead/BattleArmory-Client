name: Inspect Decocraft dedupe targets
on:
  push:
    paths:
      - '.github/workflows/inspect-decocraft-dedupe-targets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dump target signatures and relevant bytecode
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'payload/mods/decocraft-3.0.4-1.20.1-slim.jar|com.razz.decocraft.utils.JsonParser|com.razz.decocraft.models.bbmodel.BlockbenchLoader|com.razz.decocraft.models.bbmodel.BlockbenchModel' \
            'payload/mods/decocraft_nature-1.0.4-1.20.1.jar|com.razz.decocraft_nature.utils.JsonParser|com.razz.decocraft_nature.models.bbmodel.BlockbenchLoader|com.razz.decocraft_nature.models.bbmodel.BlockbenchModel'; do
            IFS='|' read -r jar parser loader model <<< "$spec"
            echo "===== JAR $jar ====="
            test -s "$jar"
            for c in "$parser" "$loader" "$model"; do
              echo "----- $c -----"
              javap -classpath "$jar" -p -s "$c" || true
              echo '--- bytecode ---'
              javap -classpath "$jar" -p -c "$c" | sed -n '1,520p' || true
            done
          done
