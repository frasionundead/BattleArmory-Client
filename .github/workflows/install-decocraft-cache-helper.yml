name: Install Decocraft cache helper payload

on:
  push:
    paths:
      - '.build/battlearmory-decocraft-cache-1.0.0.jar.b64'
      - '.github/workflows/install-decocraft-cache-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode exact helper jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/mods
          base64 -d .build/battlearmory-decocraft-cache-1.0.0.jar.b64 > payload/mods/battlearmory-decocraft-cache-1.0.0.jar
          test "$(wc -c < payload/mods/battlearmory-decocraft-cache-1.0.0.jar)" -eq 6950
          echo '23f6492b474a9a39a05d6e64d9b70de90005e3f3bc0adc7130c0968b07a1b214  payload/mods/battlearmory-decocraft-cache-1.0.0.jar' | sha256sum -c -
          jar tf payload/mods/battlearmory-decocraft-cache-1.0.0.jar | grep -q '^META-INF/coremods.json$'
          jar tf payload/mods/battlearmory-decocraft-cache-1.0.0.jar | grep -q '^META-INF/mods.toml$'
          jar tf payload/mods/battlearmory-decocraft-cache-1.0.0.jar | grep -q '^coremods/battlearmory_decocraft_cache.js$'
          javap -classpath payload/mods/battlearmory-decocraft-cache-1.0.0.jar -p com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -q 'getModel'
          printf '%s\n' '23f6492b474a9a39a05d6e64d9b70de90005e3f3bc0adc7130c0968b07a1b214' > payload/mods/battlearmory-decocraft-cache-1.0.0.jar.sha256
          printf '%s\n' '6950' > payload/mods/battlearmory-decocraft-cache-1.0.0.jar.size
      - name: Commit helper payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'battle-armory-bot'
          git config user.email 'battle-armory-bot@users.noreply.github.com'
          git add payload/mods/battlearmory-decocraft-cache-1.0.0.jar \
                  payload/mods/battlearmory-decocraft-cache-1.0.0.jar.sha256 \
                  payload/mods/battlearmory-decocraft-cache-1.0.0.jar.size
          git diff --cached --quiet && exit 0
          git commit -m 'Add Battle Armory Decocraft client cache helper'
          git push
