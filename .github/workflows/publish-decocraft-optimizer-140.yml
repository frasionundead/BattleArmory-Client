name: Publish Decocraft optimizer 1.4.0 baked-quad dedupe
on:
  push:
    paths:
      - '.github/workflows/publish-decocraft-optimizer-140.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Add baked-quad interning
        shell: bash
        run: |
          set -euxo pipefail
          python .github/scripts/patch-decocraft-140.py
          grep -n 'canonicalBakedQuad' tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          grep -n 'QUAD_MAX_ENTRIES' tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          grep -n 'baked_quad_dedupe' tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js
          grep -n 'version="1.4.0"' tools/decocraft-cache/META-INF/mods.toml

      - name: Verify bakery targets in both Decocraft jars
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'payload/mods/decocraft-3.0.4-1.20.1-slim.jar|com.razz.decocraft.models.bbmodel.BlockbenchBakery' \
            'payload/mods/decocraft_nature-1.0.4-1.20.1.jar|com.razz.decocraft_nature.models.bbmodel.BlockbenchBakery'; do
            IFS='|' read -r jar bakery <<< "$spec"
            javap -classpath "$jar" -p -s "$bakery" | grep -A1 'BakedQuad bakeQuad'
            javap -classpath "$jar" -p -c "$bakery" | grep 'BakedQuad."<init>":([IILnet/minecraft/core/Direction;Lnet/minecraft/client/renderer/texture/TextureAtlasSprite;Z)V'
          done

      - name: Compile and package optimizer
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/decocraft140 dist
          mkdir -p build/decocraft140/classes build/decocraft140/jar/META-INF build/decocraft140/jar/coremods dist
          javac -source 17 -target 17 \
            -d build/decocraft140/classes \
            tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java
          cp -R build/decocraft140/classes/com build/decocraft140/jar/
          cp tools/decocraft-cache/META-INF/mods.toml build/decocraft140/jar/META-INF/mods.toml
          cp tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js build/decocraft140/jar/coremods/
          OLD=payload/mods/battlearmory-decocraft-cache-1.0.0.jar
          unzip -p "$OLD" META-INF/MANIFEST.MF > build/decocraft140/MANIFEST.MF
          unzip -p "$OLD" META-INF/coremods.json > build/decocraft140/jar/META-INF/coremods.json
          unzip -p "$OLD" pack.mcmeta > build/decocraft140/jar/pack.mcmeta
          unzip -p "$OLD" battlearmory_translucent_materials.txt > build/decocraft140/jar/battlearmory_translucent_materials.txt
          node --check tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js
          jar cfm dist/battlearmory-decocraft-cache-1.4.0.jar build/decocraft140/MANIFEST.MF -C build/decocraft140/jar .

      - name: Static verification
        shell: bash
        run: |
          set -euxo pipefail
          JAR=dist/battlearmory-decocraft-cache-1.4.0.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^META-INF/coremods.json$'
          jar tf "$JAR" | grep -q '^coremods/battlearmory_decocraft_cache.js$'
          javap -classpath "$JAR" com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -q 'canonicalBakedQuad'
          javap -classpath "$JAR" com.battlearmory.decocraftcache.DecocraftCacheRuntime | grep -q 'sharedResourceModel'
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'version="1.4.0"'
          unzip -p "$JAR" coremods/battlearmory_decocraft_cache.js | grep -q 'baked_quad_dedupe'
          unzip -p "$JAR" coremods/battlearmory_decocraft_cache.js | grep -q 'canonicalBakedQuad'
          sha256sum "$JAR"
          wc -c < "$JAR"

      - name: Publish payload and build 0012
        shell: bash
        run: |
          set -euxo pipefail
          JAR=dist/battlearmory-decocraft-cache-1.4.0.jar
          DEST=payload/mods/battlearmory-decocraft-cache-1.0.0.jar
          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          SIZE="$(wc -c < "$JAR" | tr -d '[:space:]')"
          cp "$JAR" "$DEST"
          printf '%s\n' "$SHA" > "$DEST.sha256"
          printf '%s\n' "$SIZE" > "$DEST.size"

          SHA="$SHA" SIZE="$SIZE" python - <<'PY'
          import json, os
          from pathlib import Path
          old = json.loads(Path('builds/0011.json').read_text(encoding='utf-8'))
          old['build'] = 12
          old['name'] = 'Battle Armory Client 0012'
          old['state'] = 'staging'
          found = False
          for f in old.get('files', []):
              if f.get('path') == 'mods/battlearmory-decocraft-cache-1.0.0.jar':
                  f['size'] = int(os.environ['SIZE'])
                  f['sha256'] = os.environ['SHA']
                  found = True
          if not found:
              raise SystemExit('helper entry missing from build 0011')
          for c in old.get('components', []):
              if c.get('id') == 'decocraft_render_cache':
                  c['notes'] = ('v1.4.0 client optimizer: v1.3.0 BBModel graph dedupe plus content-addressed '
                                'BakedQuad interning for Decocraft and Decocraft Nature. Identical baked vertex arrays, '
                                'direction, sprite, tint and shade share one immutable BakedQuad/int[] pair. Quad interner '
                                'is cleared before resource reload and capped to prevent unbounded cache growth.')
          Path('builds/0012.json').write_text(json.dumps(old, indent=2) + '\n', encoding='utf-8')
          stable = json.loads(Path('stable.json').read_text(encoding='utf-8'))
          stable['build'] = 12
          stable['build_manifest'] = 'builds/0012.json'
          stable['status'] = 'staging'
          Path('stable.json').write_text(json.dumps(stable, indent=2) + '\n', encoding='utf-8')
          PY

          python -m json.tool builds/0012.json >/dev/null
          python -m json.tool stable.json >/dev/null
          grep -n '"build": 12' stable.json
          grep -n 'battlearmory-decocraft-cache-1.0.0.jar' builds/0012.json
          git config user.name 'battlearmory-bot'
          git config user.email 'battlearmory-bot@users.noreply.github.com'
          git add \
            tools/decocraft-cache/src/com/battlearmory/decocraftcache/DecocraftCacheRuntime.java \
            tools/decocraft-cache/coremods/battlearmory_decocraft_cache.js \
            tools/decocraft-cache/META-INF/mods.toml \
            payload/mods/battlearmory-decocraft-cache-1.0.0.jar \
            payload/mods/battlearmory-decocraft-cache-1.0.0.jar.sha256 \
            payload/mods/battlearmory-decocraft-cache-1.0.0.jar.size \
            builds/0012.json stable.json
          git commit -m 'Publish Decocraft baked-quad optimizer 1.4.0 as build 0012'
          git push
